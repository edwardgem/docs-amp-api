  /api/hitl/request:
    post:
      summary: HITL Request
      description: 'Submit a HITL request and optionally register a completion callback.


        AMP-HITL evaluates WHEN/WHO/WHAT/WHERE and either returns `no-hitl` immediately
        or accepts the request and completes later via human or auto routing.'
      operationId: post_proxy_hitl_api_hitl_request
      tags:
      - HITL
      responses:
        '200':
          description: No HITL needed or HITL disabled.
          content:
            application/json:
              example:
                status: no-hitl
                information: WHEN condition not met
        '400':
          description: Validation or preflight error.
          content:
            application/json:
              example:
                status: error
                error: callback_url_invalid_scheme
                information: callback URL must use http or https
        '401':
          description: Unauthorized
        '500':
          description: Server error
        '202':
          description: Accepted for asynchronous HITL processing.
          content:
            application/json:
              example:
                status: waiting-for-response
                caller_id: invoice-payment-agent-5c58-20260310135042
                information:
                  who: initiator@example.com
                  what: approval
                  where: amp
                  notify:
                  - email
                links:
                  status: /api/hitl/status?caller_id=invoice-payment-agent-5c58-20260310135042
      x-source:
        file: /Users/edwardc/Projects/amp-backend/app.py
        function: proxy_hitl
        line: 8736
      x-audience: public
      security:
      - ApiKeyAuth: []
      - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - caller_id
              - instance_id
              - org_id
              - agent_name
              properties:
                caller_id:
                  type: string
                  description: Canonical HITL correlation ID. Usually the instance_id
                    is the caller_id, but when an agent calls HITL multiple of times,
                    caller_id can add a suffix to instance_id to differentiate the
                    calls.
                instance_id:
                  type: string
                  description: Agent instance id. Alias of caller_id for compatibility.
                org_id:
                  type: string
                  description: The organization id.
                agent_name:
                  type: string
                  description: The name of the agent type registered under this organization.
                    E.g., "invoice-payment-agent-5c58".
                rlhf:
                  type: object
                  description: RLHF/policy evaluation inputs for this HITL request.
                    This may include action context, facts context, criteria results,
                    and other relevant information to inform HITL routing and decisions.
                    AMP will evaluate this information against the RLHF policies associated
                    with the agent to help determine the appropriate routing and decision
                    logic for this HITL request.
                  properties:
                    policy_values_source:
                      type: string
                      enum:
                      - external
                      - internal
                    action_context:
                      type: object
                      additionalProperties: true
                    facts_context:
                      type: object
                      additionalProperties: true
                    criteria:
                      type: array
                      items:
                        type: object
                        additionalProperties: true
                    evidence:
                      type: object
                      additionalProperties: true
                    run_mode:
                      type: string
                    sim_run_id:
                      type: string
                    sim_time:
                      type: string
                    checkpoint_id:
                      type: string
                hitl:
                  type: object
                  description: HITL configuration for this request in JSON to specify
                    the WHEN, WHO, WHAT, WHERE, and NOTIFY conditions for the HITL
                    request. If not provided, AMP will use default HITL settings if
                    enabled.
                  properties:
                    enable:
                      type: boolean
                    when:
                      type: string
                    who:
                      type: string
                    what:
                      type: string
                      enum:
                      - approval
                      - notify
                    where:
                      type: string
                      enum:
                      - amp
                      description: The decision locus -- where the approve/reject/modify
                        decision is actually made. Only 'amp' is supported today;
                        the human always decides in AMP, whether or not they were
                        also alerted via `notify`. Approve-by-email (a human replying
                        to the alert email instead of visiting AMP) is not implemented
                        -- 'email' is rejected with where_email_not_yet_supported.
                    notify:
                      type: array
                      items:
                        type: string
                      description: 'Optional alert channels, independent of `where`.
                        The reviewer still decides in AMP either way; this only controls
                        whether they''re also pinged. Only ''email'' delivers anything
                        today (sent to the resolved `who` address -- AMP usernames
                        are always email addresses, so no separate address is collected).
                        Unrecognized channel names are silently dropped rather than
                        rejected, so configs written ahead of a future channel (e.g.
                        ''slack'') landing won''t break. Default: no alert. No batching
                        or rate limiting -- one email per workitem, so leave this
                        off for agents that raise many HITL requests in a short window
                        unless an email per request is actually what you want.'
                callback:
                  type: object
                  description: Optional callback configuration for HITL completion.
                    If provided, AMP will call the specified URL with the HITL result
                    when available.
                  properties:
                    url:
                      type: string
                      format: uri
                    secret:
                      type: string
                    timeout_ms:
                      type: integer
                      minimum: 500
                      maximum: 30000
                  required:
                  - url
            example:
              caller_id: invoice-payment-agent-5c58-20260310135042
              instance_id: invoice-payment-agent-5c58-20260310135042
              org_id: O-0011-ST20251201090030
              agent_name: invoice-payment-agent-5c58
              rlhf:
                policy_values_source: external
                action_context:
                  action_type: approve_payment
                  resource_type: invoice
                  resource_id: invoice-payment-agent-5c58-20260310135042
                facts_context:
                  amount_over_threshold: true
                criteria:
                - criterion_id: c_amount_within_policy
                  result: true
                - criterion_id: c_vendor_risk_acceptable
                  result: true
              hitl:
                enable: true
                when: amount > 1000
                who: initiator
                what: approval
                where: amp
                notify:
                - email
              callback:
                url: https://caller.example.com/hitl/callback
                secret: shared-secret
                timeout_ms: 5000
